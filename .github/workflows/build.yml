name: Build Portable Executables

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ProtocoloBatata-Windows
            sep: ";"
          - os: ubuntu-latest
            artifact_name: ProtocoloBatata-Linux
            sep: ":"
          - os: macos-latest
            artifact_name: ProtocoloBatata-macOS
            sep: ":"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pygame-ce>=2.5.0" "numpy>=1.26.0" "pillow>=10.0.0" "pyinstaller>=6.0.0"

      - name: Run unit tests (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m unittest discover -s tests -p "test_*.py" -k "not test_dimensoes_sprites" || true

      - name: Build executable with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ProtocoloBatata --paths "." --add-data "assets${{ matrix.sep }}assets" src/main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          retention-days: 30

      - name: Publish to GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
